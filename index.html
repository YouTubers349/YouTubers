```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTubers</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:white;font-family:Arial,sans-serif}
header{background:#181818;padding:20px;font-size:28px;font-weight:bold;color:#ff3030}
main{padding:18px;max-width:850px;margin:auto}
input{width:100%;padding:15px;border-radius:25px;border:1px solid #444;background:#222;color:white;margin:12px 0;font-size:16px}
button{border:0;padding:13px 18px;border-radius:22px;background:#333;color:white;cursor:pointer;margin:4px}
button.active,.search{background:#ff3030}
.search{width:100%;font-weight:bold;font-size:16px}
.card{background:#1c1c1c;border-radius:14px;padding:15px;margin:18px 0}
.card img{width:100%;border-radius:10px}
.card p{color:#aaa}
.player{width:100%;aspect-ratio:16/9;margin-top:12px}
.player iframe{width:100%;height:100%;border:0;border-radius:10px}
.upload{background:#ff3030}
.note{color:#aaa;font-size:13px}
</style>
</head>
<body>

<header>▶ YouTubers</header>

<main>
<h2>🔎 Поиск YouTubers</h2>

<input id="query" placeholder="Что хочешь найти?">
<button class="search" onclick="searchYouTube()">Найти 🔎</button>

<div>
<button id="videoBtn" class="active" onclick="setType('video')">🎬 Видео</button>
<button id="channelBtn" onclick="setType('channel')">👤 Каналы</button>
</div>

<div id="results"></div>

<hr style="border-color:#333;margin:30px 0">

<h2>📤 Мои видео</h2>
<button class="upload" onclick="document.getElementById('file').click()">＋ Загрузить видео</button>
<input id="file" type="file" accept="video/*" hidden>
<div id="myVideos"></div>

<p class="note">YouTubers — твоя видеоплатформа ❤️</p>
</main>

<script>
const API_KEY = "AIzaSyAVIs_BJczGikz4y9feC5S6lZblSfX1jeo";
let type = "video";

function setType(newType){
  type = newType;
  document.getElementById("videoBtn").classList.toggle("active",type==="video");
  document.getElementById("channelBtn").classList.toggle("active",type==="channel");
}

async function searchYouTube(){
  const query = document.getElementById("query").value.trim();
  const results = document.getElementById("results");

  if(!query){
    results.textContent = "Напиши, что хочешь найти!";
    return;
  }

  if(API_KEY === "ТВОЙ_API_KEY"){
    results.textContent = "Сначала подключи API Key.";
    return;
  }

  results.textContent = "Ищем... 🔎";

  try{
    const url = "https://www.googleapis.com/youtube/v3/search?part=snippet&q="
      + encodeURIComponent(query)
      + "&type=" + type
      + "&maxResults=15&key=" + encodeURIComponent(API_KEY);

    const response = await fetch(url);
    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error?.message || "Ошибка поиска");
    }

    results.innerHTML = "";

    if(!data.items || data.items.length===0){
      results.textContent = "Ничего не найдено 😢";
      return;
    }

    data.items.forEach(item=>{
      const s = item.snippet;
      const id = type==="video" ? item.id.videoId : item.id.channelId;
      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h3");
      title.textContent = s.title;

      const author = document.createElement("p");
      author.textContent = s.channelTitle;

      card.append(title,author);

      if(type==="video"){
        const img = document.createElement("img");
        img.src = s.thumbnails.high?.url || s.thumbnails.default.url;

        const button = document.createElement("button");
        button.className = "search";
        button.textContent = "▶ Смотреть на YouTubers";

        const playerBox = document.createElement("div");

        button.onclick = ()=>{
          playerBox.className = "player";
          const iframe = document.createElement("iframe");
          iframe.src = "https://www.youtube.com/embed/" + encodeURIComponent(id);
          iframe.title = s.title;
          iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
          iframe.allowFullscreen = true;
          playerBox.replaceChildren(iframe);
          button.textContent = "Видео открыто ❤️";
        };

        card.append(img,button,playerBox);
      }else{
        const link = document.createElement("a");
        link.href = "https://www.youtube.com/channel/" + encodeURIComponent(id);
        link.textContent = "Открыть канал";
        link.style.color = "#ff5555";
        link.target = "_blank";
        link.rel = "noopener";
        card.append(link);
      }

      results.appendChild(card);
    });

  }catch(error){
    results.textContent = "Ошибка: " + error.message;
  }
}

document.getElementById("query").addEventListener("keydown",e=>{
  if(e.key==="Enter") searchYouTube();
});

document.getElementById("file").addEventListener("change",function(){
  const file = this.files[0];
  if(!file)return;

  const url = URL.createObjectURL(file);
  const card = document.createElement("div");
  card.className = "card";

  const title = document.createElement("h3");
  title.textContent = file.name;

  const video = document.createElement("video");
  video.src = url;
  video.controls = true;
  video.style.width = "100%";

  card.append(title,video);
  document.getElementById("myVideos").prepend(card);
});
</script>

</body>
</html>
```
