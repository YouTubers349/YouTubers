<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTubers</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --purple: #a855f7;
  --blue: #38bdf8;
  --bg: #080811;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 15% 0%, #32105a55, transparent 45%),
    radial-gradient(ellipse at 90% 25%, #063b5b44, transparent 40%),
    var(--bg);
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

header {
  padding: 22px 18px;
  background: #10101ddd;
  border-bottom: 1px solid #a855f744;
  position: relative;
  z-index: 2;
}

.logo {
  display: inline-block;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(90deg, #c084fc, #38bdf8);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: logoGlow 2.5s ease-in-out infinite alternate;
}

@keyframes logoGlow {
  from {
    filter: drop-shadow(0 0 3px #a855f7);
    transform: scale(1);
  }
  to {
    filter: drop-shadow(0 0 13px #38bdf8);
    transform: scale(1.035);
  }
}

main {
  max-width: 850px;
  margin: auto;
  padding: 22px 16px 50px;
}

h2 {
  font-size: 23px;
  margin: 12px 0 20px;
}

.welcome {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #080811;
  animation: welcomeOut 1s ease 2.1s forwards;
  pointer-events: none;
}

.welcome span {
  font-size: clamp(25px, 7vw, 42px);
  font-weight: 900;
  text-align: center;
  padding: 20px;
  background: linear-gradient(90deg, #c084fc, #38bdf8);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: welcomeIn 1s ease both;
}

@keyframes welcomeIn {
  from {
    opacity: 0;
    transform: translateY(25px) scale(.8);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes welcomeOut {
  to {
    opacity: 0;
    visibility: hidden;
  }
}

.intro {
  opacity: 0;
  animation: appear .8s ease 2.5s forwards;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(22px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.search-box {
  padding: 3px;
  border-radius: 19px;
  background: linear-gradient(110deg, #a855f7, #38bdf8);
  transition: transform .25s ease, filter .25s ease;
  margin: 18px 0 12px;
}

.search-box:focus-within {
  transform: translateY(-5px) scale(1.015);
  filter: drop-shadow(0 0 12px #a855f788);
}

input {
  width: 100%;
  padding: 17px;
  border: 0;
  outline: none;
  border-radius: 16px;
  background: #11111f;
  color: white;
  font-size: 16px;
}

input::placeholder {
  color: #9292a9;
}

button {
  border: 1px solid #a855f766;
  padding: 13px 19px;
  border-radius: 15px;
  background: #171528;
  color: white;
  cursor: pointer;
  font-size: 15px;
  margin: 5px 4px 5px 0;
  transition: transform .2s ease, box-shadow .2s ease,
              background .2s ease;
}

button:active {
  transform: translateY(-4px) scale(1.03);
  box-shadow: 0 0 18px #a855f799;
}

.search {
  width: 100%;
  padding: 16px;
  font-weight: bold;
  font-size: 17px;
  background: linear-gradient(100deg, #9333ea, #0284c7);
  border: none;
  box-shadow: 0 0 15px #9333ea55;
}

.tabs {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}

.tabs button {
  flex: 1;
  padding: 15px 8px;
}

button.active {
  background: linear-gradient(100deg, #9333ea, #0284c7);
  border-color: transparent;
  box-shadow: 0 0 15px #9333ea66;
}

.card {
  background: linear-gradient(145deg, #191629, #101522);
  border: 1px solid #8b5cf644;
  border-radius: 19px;
  padding: 15px;
  margin: 18px 0;
  animation: cardIn .55s ease both;
  box-shadow: 0 8px 25px #0005;
  transition: transform .25s ease, box-shadow .25s ease,
              border-color .25s ease;
}

.card:active {
  transform: translateY(-5px);
  border-color: #38bdf8;
  box-shadow: 0 0 22px #9333ea66;
}

@media (hover: hover) and (pointer: fine) {
  .card:hover {
    transform: translateY(-5px);
    border-color: #38bdf8;
    box-shadow: 0 0 22px #9333ea66;
  }
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card img {
  width: 100%;
  border-radius: 13px;
  display: block;
  margin: 12px 0;
}

.card h3 {
  line-height: 1.4;
}

.card p {
  color: #aaa9c4;
}

.channel-avatar {
  width: 90px !important;
  height: 90px;
  object-fit: cover;
  border-radius: 50% !important;
  border: 2px solid #a855f7;
  box-shadow: 0 0 15px #a855f788;
}

.player {
  width: 100%;
  aspect-ratio: 16 / 9;
  margin-top: 14px;
  animation: playerIn .45s ease both;
}

@keyframes playerIn {
  from {
    opacity: 0;
    transform: translateY(15px) scale(.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.player iframe {
  width: 100%;
  height: 100%;
  border: 1px solid #a855f766;
  border-radius: 13px;
}

.channel-link {
  color: #67cfff;
  text-decoration: none;
  display: inline-block;
  padding: 10px 0;
}

.note {
  color: #8888a5;
  text-align: center;
  margin-top: 35px;
}

#status {
  color: #c4b5fd;
  margin: 15px 0;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="welcome">
  <span>Приветствуем в YouTubers 💜</span>
</div>

<header>
  <span class="logo">▶ YouTubers</span>
</header>

<main>
  <section class="intro">

    <h2>✨ Открой мир видео</h2>

    <div class="search-box">
      <input
        id="query"
        placeholder="🔎 Что хочешь найти?"
        autocomplete="off">
    </div>

    <button class="search" id="searchBtn">
      Найти 🔎
    </button>

    <div class="tabs">
      <button id="videoBtn" class="active">🎬 Видео</button>
      <button id="channelBtn">👤 Каналы</button>
    </div>

    <div id="status" aria-live="polite"></div>
    <div id="results"></div>

    <p class="note">YouTubers — твой мир видео 💜</p>

  </section>
</main>

<script>
const API = "https://youtubers-server.onvoroa.com/api/search";

let type = "video";

const query = document.getElementById("query");
const results = document.getElementById("results");
const status = document.getElementById("status");

function setType(newType) {
  type = newType;

  document.getElementById("videoBtn")
    .classList.toggle("active", type === "video");

  document.getElementById("channelBtn")
    .classList.toggle("active", type === "channel");

  results.innerHTML = "";
  status.textContent = "";
}

document.getElementById("videoBtn").addEventListener(
  "click", () => setType("video")
);

document.getElementById("channelBtn").addEventListener(
  "click", () => setType("channel")
);

document.getElementById("searchBtn").addEventListener(
  "click", searchYouTube
);

query.addEventListener("keydown", event => {
  if (event.key === "Enter") searchYouTube();
});

async function searchYouTube() {
  const value = query.value.trim();

  if (!value) {
    status.textContent = "Напиши, что хочешь найти 💜";
    return;
  }

  results.innerHTML = "";
  status.textContent = "Ищем... 🔎";

  try {
    const url = API +
      "?q=" + encodeURIComponent(value) +
      "&type=" + type;

    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка поиска");
    }

    if (!data.items || data.items.length === 0) {
      status.textContent = "Ничего не найдено 😢";
      return;
    }

    status.textContent = "Найдено: " + data.items.length;

    data.items.forEach((item, index) => {
      const snippet = item.snippet;
      const id = type === "video"
        ? item.id.videoId
        : item.id.channelId;

      const card = document.createElement("div");
      card.className = "card";
      card.style.animationDelay = (index * 0.06) + "s";

      const title = document.createElement("h3");
      title.textContent = snippet.title;

      const author = document.createElement("p");
      author.textContent = snippet.channelTitle || "";

      card.append(title, author);

      if (type === "video") {
        const img = document.createElement("img");
        img.src = snippet.thumbnails.high?.url ||
                  snippet.thumbnails.default.url;
        img.alt = snippet.title;
        img.loading = "lazy";

        const button = document.createElement("button");
        button.className = "search";
        button.textContent = "▶ Смотреть на YouTubers";

        const playerBox = document.createElement("div");

        button.addEventListener("click", () => {
          playerBox.className = "player";

          const iframe = document.createElement("iframe");
          iframe.src =
            "https://www.youtube.com/embed/" +
            encodeURIComponent(id);

          iframe.title = snippet.title;
          iframe.allow =
            "accelerometer; autoplay; clipboard-write; " +
            "encrypted-media; gyroscope; picture-in-picture; web-share";
          iframe.allowFullscreen = true;

          playerBox.replaceChildren(iframe);
          button.textContent = "Видео открыто 💜";
        });

        card.append(img, button, playerBox);

      } else {
        const img = document.createElement("img");
        img.className = "channel-avatar";
        img.src = snippet.thumbnails.high?.url ||
                  snippet.thumbnails.default?.url || "";
        img.alt = snippet.title;
        img.loading = "lazy";

        const link = document.createElement("a");
        link.className = "channel-link";
        link.href =
          "https://www.youtube.com/channel/" +
          encodeURIComponent(id);
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "Открыть канал →";

        card.insertBefore(img, title);
        card.append(link);
      }

      results.appendChild(card);
    });

  } catch (error) {
    status.textContent = "Ошибка: " + error.message;
  }
}
</script>

</body>
</html>
