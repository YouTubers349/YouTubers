<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTubers</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:white;font-family:Arial,sans-serif}
header{background:#181818;padding:18px;display:flex;align-items:center;gap:12px}
.logo{color:#ff3030;font-size:25px;font-weight:bold}
main{padding:20px}
input{width:100%;padding:14px;border-radius:25px;border:1px solid #444;background:#222;color:white;margin:15px 0}
h2{font-size:21px}
.upload{background:#ff3030;color:white;border:0;padding:13px 20px;border-radius:8px;font-weight:bold}
.card{background:#1c1c1c;border-radius:12px;padding:15px;margin-top:20px}
video{width:100%;border-radius:10px}
</style>
</head>
<body>
<header>
<div class="logo">▶ YouTubers</div>
</header>
<main>
<h2>Смотри видео 🎬</h2>
<input type="search" placeholder="Поиск видео...">
<button class="upload" onclick="document.getElementById('file').click()">＋ Загрузить видео</button>
<input id="file" type="file" accept="video/*" hidden>
<div id="videos"></div>
</main>
<script>
document.getElementById('file').addEventListener('change',function(){
const file=this.files[0];
if(!file)return;
const url=URL.createObjectURL(file);
const card=document.createElement('div');
card.className='card';
const title=document.createElement('h3');
title.textContent=file.name;
const video=document.createElement('video');
video.src=url;
video.controls=true;
card.append(title,video);
document.getElementById('videos').prepend(card);
});
</script>
</body>
</html>
